name: story-start
trigger: story_start
runner: codex
artifact_workspace:
  root: .mana
  routing: feature_or_session
  initialize_if_missing: true
  default_purpose: story-delivery
service_context:
  root: .mana/global
  core_files:
  - service-mission.md
  - architecture.md
  - engineering-guards.md
  optional_files:
  - domain-glossary.md
  - integration-map.md
  - testing-policy.md
  - database-policy.md
  missing_file_behavior: warn
  guard_violation_behavior: block_or_require_owner_approval
agents:
- story-implementation-planner
skills:
- acceptance-criteria-testability
- architecture-risk
- cross-service-contract
- epic-goal-extraction
- green-border-plan
- liquibase-production-risk
- jira-acceptance-criteria-normalizer
- source-impact-map
- story-effort-estimation
- story-quality
- technical-task-breakdown
skill_activation:
  baseline:
  - story-quality
  - acceptance-criteria-testability
  - jira-acceptance-criteria-normalizer
  - source-impact-map
  conditional:
    epic_or_parent_objective_present: epic-goal-extraction
    implementation_scope_confirmed: technical-task-breakdown
    implementation_scope_and_test_requirements_confirmed: green-border-plan
    estimation_explicitly_requested_and_scope_confirmed: story-effort-estimation
    architecture_boundary_change: architecture-risk
    api_event_or_client_contract_change: cross-service-contract
    migration_or_schema_change: liquibase-production-risk
implementation_contract:
  authoritative_input_behavior: do_not_rederive_or_reload
  contract_conflict_behavior: block_without_alternate_design
  numeric_estimate_behavior_when_blocked: not_estimable
  implementation_effort_scope: code_and_direct_automated_tests_only
blocking_conditions:
  - unresolved blocker findings
  - explicit implementation contract conflicts with the proposed plan
  - missing required artifacts
  - unsafe database, security, architecture, or cross-service risk without owner approval
warning_conditions:
  - medium-risk ambiguity with owner acknowledgement
  - incomplete optional evidence
  - MCP read limitation documented for follow-up
expected_max_duration: 30 minutes
human_approval_requirement: true
