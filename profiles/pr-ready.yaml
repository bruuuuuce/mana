name: pr-ready
trigger: pr_ready
runner: codex
artifact_workspace:
  root: .mana
  routing: feature_or_session
  initialize_if_missing: true
  default_purpose: pr-readiness
service_context:
  root: .mana/global
  core_files:
  - service-mission.md
  - architecture.md
  - engineering-guards.md
  optional_files:
  - domain-glossary.md
  - integration-map.md
  - testing-policy.md
  - database-policy.md
  missing_file_behavior: warn
  guard_violation_behavior: block_or_require_owner_approval
agents:
- pr-readiness-agent
skills:
- architecture-guard-detector
- architecture-risk
- changed-files-risk-classifier
- cross-service-contract
- dependency-security-evidence
- developer-decision-review
- developer-handoff
- development-summary
- jira-acceptance-criteria-normalizer
- liquibase-production-risk
- pre-review-defect
- sonar-evidence-triage
- test-quality
skill_activation:
  baseline:
  - changed-files-risk-classifier
  - development-summary
  conditional:
    acceptance_criteria_or_jira: jira-acceptance-criteria-normalizer
    engineering_guard_match: architecture-guard-detector
    existing_sonar_evidence: sonar-evidence-triage
    dependency_manifest_or_lockfile_change: dependency-security-evidence
    non_obvious_choice_or_plan_drift: developer-decision-review
    maintainer_handoff_needed: developer-handoff
    application_code_change: pre-review-defect
    architecture_boundary_change: architecture-risk
    api_event_or_client_contract_change: cross-service-contract
    migration_or_schema_change: liquibase-production-risk
    test_evidence_present: test-quality
blocking_conditions:
  - unresolved blocker findings
  - missing required artifacts
  - unsafe database, security, architecture, or cross-service risk without owner approval
warning_conditions:
  - medium-risk ambiguity with owner acknowledgement
  - incomplete optional evidence
  - MCP read limitation documented for follow-up
expected_max_duration: 15 minutes
human_approval_requirement: true
