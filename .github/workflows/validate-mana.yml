name: Validate Mana
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install validation dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Shell syntax
        run: bash -n scripts/*.sh hooks/pre-commit hooks/pre-push
      - name: Validate repository
        run: scripts/validate-repo.sh
      - name: Single-process Inspect snapshot regression
        run: python3 tests/mana-inspect-snapshot.py
      - name: Wide Windows file identities
        run: python3 tests/mana-file-identities.py
      - name: Human Feedback producer
        run: tests/mana-human-feedback.sh
      - name: Human decisions public replanning
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/story-start-human-decisions.py
      - name: Activity pagination
        run: python3 tests/mana-inspect-activity-pages.py
      - name: Mana doctor
        env:
          MANA_UPDATE_CHECK: off
        run: scripts/mana-doctor.sh
      - name: User Context Layer
        run: tests/user-context.sh
      - name: User Learning Capture
        run: tests/user-learning.sh
      - name: User Learning Aggregation
        run: tests/user-learning-aggregation.sh
      - name: User Learning Synthesis
        run: tests/user-learning-synthesis.sh
      - name: User Learning Review
        run: tests/user-learning-review.sh
      - name: User Learning end-to-end acceptance
        run: tests/user-learning-e2e.sh
      - name: Mana Journey Model v0
        run: tests/mana-journey.sh
      - name: Mana Concept Registry v0
        run: tests/mana-concepts.sh
      - name: Mana Concept tagging and teaching v0
        run: tests/mana-concept-tagging.sh
      - name: Mana Scout v0
        run: tests/mana-scout.sh
      - name: Mana Scout cycle hardening v0
        run: tests/mana-scout-cycles.sh
      - name: Mana Expansion v0
        run: tests/mana-expand.sh
      - name: Mana rationale v0
        run: tests/mana-rationale.sh
      - name: Mana Git archaeology v0
        run: tests/mana-history.sh
      - name: Mana diagram enrichment v0
        run: tests/mana-diagram.sh
      - name: Verification Skills
        run: tests/verification-skills.sh
      - name: Specialist skill candidates
        run: python3 tests/mana-skill-factory.py
      - name: Transaction boundary scenarios
        run: python3 tests/transaction-boundaries.py
      - name: Transaction transition contract
        run: python3 tests/transaction-transition-contract.py
      - name: Transaction AOP and causal ordering
        run: python3 tests/transaction-aop-causal-order.py
      - name: Provider dispatch
        run: tests/provider-dispatch.sh
      - name: Repair containment
        run: tests/repair-containment.sh
      - name: Bounded repair once
        run: tests/bounded-repair.sh
      - name: Bounded repair loop
        run: tests/bounded-repair-loop.sh
      - name: Complete zero-token acceptance suite
        run: tests/run-zero-token-acceptance.sh
      - name: Release readiness documentation
        run: tests/release-readiness.sh
      - name: Added coverage dependencies and filesystem baseline
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: |
          command -v python3 java javac javap
          java -version
          javac -version
          javap -version
          python3 tests/worktree-snapshot-test-only.py "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/mana-coverage-before.jsonl"
      - name: Resource Timeline
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/resource-timeline.py -v
      - name: Resource Timeline binding
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-resource-binding.py -v
      - name: Resource Timeline dispatch
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-resource-dispatch.py -v
      - name: Resource Timeline leaves
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-resource-leaves.py -v
      - name: Transaction self invocation compatibility
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-self-invocation.py -v
      - name: Transaction context alternatives compatibility
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-context-alternatives.py -v
      - name: Transaction physical lifetime compatibility
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-physical-lifetime.py -v
      - name: Transaction entry parameters compatibility
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-entry-parameters.py -v
      - name: Transaction type dependencies compatibility
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-type-dependencies.py -v
      - name: Java member bindings compatibility
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-member-bindings.py -v
      - name: Execution Dependencies
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-execution-dependencies.py -v
      - name: Executable Contract
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-executable-contract.py -v
      - name: Local Admission
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-local-admission.py -v
      - name: Transaction Visualization
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/transaction-visualization.py -v
      - name: Wait Dependencies
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/wait-dependencies.py -v
      - name: Wait Dependencies negative evidence
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/wait-dependencies-negative-evidence.py -v
      - name: Wait Dependencies historical proof exclusions
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
          MANA_F02_WITNESSES: ""
          MANA_F03_EVIDENCE: ""
        run: python3 tests/wait-dependencies-proof-exclusions.py -v
      - name: Wait Dependencies wire compatibility
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
          MANA_F02_WITNESSES: ""
          MANA_F03_EVIDENCE: ""
        run: python3 tests/wait-dependencies-wire-compatibility.py -v
      - name: Wait Dependencies F02 diagnostic replay
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
          MANA_F02_WITNESSES: ""
          MANA_F03_EVIDENCE: ""
        run: python3 tests/wait-dependencies-wire-compatibility.py --diagnostic-replay -v
      - name: Added coverage filesystem preservation
        if: ${{ !cancelled() }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 tests/worktree-snapshot-test-only.py "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/mana-coverage-after.jsonl"
          cmp "$RUNNER_TEMP/mana-coverage-before.jsonl" "$RUNNER_TEMP/mana-coverage-after.jsonl"
