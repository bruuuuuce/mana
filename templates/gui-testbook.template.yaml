schema_version: 1
review_required: true
project_root: "{{absolute_project_root}}"
target:
  reference: "{{redacted_target_reference}}"
  classification: "isolated_test"
  environment: "dedicated_test"
playwright:
  config: "{{relative_playwright_config_path}}"
  artifacts:
    trace: required
    screenshot: required
    video: required
    junit: required
tests:
  - id: "{{stable_gui_test_id}}"
    kind: "gui"
    command: "npx playwright test {{relative_spec_path}}"
    command_origin: "approved_playwright_spec"
    source:
      - "{{requirement_or_document_reference}}"
    preconditions: "{{redacted_preconditions}}"
    test_data_refs:
      - "{{vault_or_environment_reference}}"
    cleanup: "{{approved_cleanup_reference}}"
    environment: "dedicated_test"
    execution_status: "needs_environment"
    safety: "requires_explicit_gui_approval"
    timeout_seconds: 900
    approved: false
