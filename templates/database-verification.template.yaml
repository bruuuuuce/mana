schema_version: 1
review_required: true
project_root: "{{absolute_project_root}}"
target:
  reference: "{{redacted_database_reference}}"
  classification: "isolated_test"
  environment: "dedicated_test"
verifications:
  - id: "{{stable_database_verification_id}}"
    kind: "database_read"
    adapter: "postgresql"
    connection_env: "{{test_only_connection_environment_variable}}"
    query_file: "{{relative_read_only_query_path}}"
    expected_summary: "{{approved_non_sensitive_expectation}}"
    source:
      - "{{requirement_or_test_reference}}"
    environment: "dedicated_test"
    execution_status: "needs_environment"
    safety: "requires_explicit_database_read_approval"
    timeout_seconds: 300
    approved: false
