ust="spacing" textLength="546.957" x="17" y="663.28">UNKNOWN is not absence. Runtime NOT_RUN; locks and waits are not observed.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.9365" x="17" y="679.7683">P IDs are participant-local symbolic identities; no confirmed deadlock claim.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="268.0098" x="17" y="696.2566">Coverage: COMPLETE_MODELED_SCOPE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="420.1777" x="17" y="712.7448">Assessment: CONDITIONAL_CROSS_LAYER_COMPLETION_RISK</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.8389" x="17" y="729.2331">No universal deadlock freedom. See evidence.json for full source references.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="513.3857" x="17" y="745.7214">DB dashed red = candidate wait; app solid blue = synchronous completion.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="474.4277" x="17" y="762.2097">Mixed dotted purple = typed relation, not an additional DB wait edge.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.6953" x="17" y="778.698">Application/typed links are scenario-wide; only DB edges are filtered by cut.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.9248" x="17" y="795.1863">Cut replacement</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="330.5176" x="17" y="811.6745">CONDITIONAL_CROSS_LAYER_COMPLETION_RISK</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="398.6445" x="17" y="828.1628">Exclusion is scoped; missing evidence remains UNKNOWN.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="434.3896" x="17" y="844.6511">CONFLICT C6 CONDITIONAL / UNORIENTED / holder UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.8271" x="17" y="861.1394">resource=X sources=a/O1, a/O2</text><!--SRC=[dLLjR-8u4FwUNp7QVgLGwClsG9oK9a4NBKsu1AwjhgV890EuJUoixVJbtzyuq9PkjxhL2IbOzimpu-UP6HjPWv6mbCR82WgkC3TS2aVVSr4pnIhG6rR8HoxMi6AbHiTmKoBePs4sQ7YUnPbtr8SUN8RNWGz-C0iYFuYy6zeoppKMK79nhnqBpCIQNB_C_hX9Gy-T0YERMVyBC0rH7muyBpYTJ3wt76mj1w-Mj3py- -3Yw9X-dOBf3HR_7FvEM4FmtRbxuQR1VaBUrrlXnP4VpiCuSgUtGg6MZSfnV7qhyiQC5TObox52OMY3YO8NpE3ugky8QH0KNsyCo1Mbu7WbunKXKbxum0iKENRlj2MkHTH3OBruqB7VlbChhBYsczSP8R8bqzYXjLpUqLtRrGEgajLxbgoViVnxGu9qx7h9AHknRjSAlpUepNjZXOPnGUU3FTl1JsoNfSplssFP65GEYWBizVPvdoJkPT2IFjd9Smm7_jdar3_xn6odpSch6NcGDeEJK_SthnNbP0ZkR3ObEItzxtGv_q4NAgvyewIGZOOsHkR5bxDfOCz_bEBuHOhppwLmSbQMeBd18MYLzofYgdV77bXlnPzCex1tnRZHNRir79oyKRAznFdHwP5B1KOzybPWstBlGN0TU8jva6PXzEuMT9JqEv0SVqYBIFefwE3NGAceafEFeFt_14qNgQKypIPnyW7rzFyW9a6w876IuCz5IElCehxez272sOS89QujqoMkZFCjYgyYilWhIC99IEXZU61bsty5QCDeqj2VQd8h5qXHFey0dv2wbgOLx8NgEeje2yQr5H7OKhSX8Mc4uHL25C-pP16Dm3Q21cfpUBJo0oDawo79GprWqNLc4FhRVPg5b0AlcJ27vCUed9whfImfBNib6eeSzOZS8PTYnLL5QHV82Xi3SbkXNSUpNSxML8GxceBiClQ3QU1dgHVF0iVLrA7QZf_X_fKoBudJD9kwDq6ormbP4gRVd4X28pW1QyhfDU9A8HQowaAA-9vrM4a5gyRsGziUe725oXxhhkDVm7QCqcv14hpEm9QX4R2w9ZUIXQP8WsImtwcvhEeIhHvTvv8_MGBQge6wKNH0rjltG679h5LdAuy0LXJSRj05A04R2R1OOzTnwve8RerxUsz9AuZEKJ35vU4ZNMxKLeJrjevRWnKlQRoHp_8Pg4o8_iR0teHtVfNXu2al6stBZ2fAvvBo604DKstVn1Tk2TbE5GsxwkjQ-0bDkpbuP_2-5HPHd8H1D6zxQ2FB0jMBc_Fs9EtqqMFxXBGFoS0EfctJ_0i0]--></g></svg>