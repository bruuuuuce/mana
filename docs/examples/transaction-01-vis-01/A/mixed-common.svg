NCOMPLETE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="273.0273" x="17" y="647.8204">Assessment: CONDITIONAL_CYCLE_RISK</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="339.3838" x="17" y="664.3087">INCOMPLETE: UNRESOLVED_DATA_OR_CAUSALITY</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.3926" x="17" y="680.797">Candidate W1 / cut=common / EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335.7813" x="17" y="697.2852">UNKNOWN obligations: W3, W7; contradicted: W1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.3926" x="17" y="713.7735">Candidate W4 / cut=common / EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335.7813" x="17" y="730.2618">UNKNOWN obligations: W3, W7; contradicted: W1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.8389" x="17" y="746.7501">No universal deadlock freedom. See evidence.json for full source references.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="513.3857" x="17" y="763.2384">DB dashed red = candidate wait; app solid blue = synchronous completion.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="474.4277" x="17" y="779.7266">Mixed dotted purple = typed relation, not an additional DB wait edge.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.6953" x="17" y="796.2149">Application/typed links are scenario-wide; only DB edges are filtered by cut.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.2402" x="17" y="812.7032">Cut common</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.3672" x="17" y="829.1915">CONDITIONAL_CYCLE_RISK</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="398.6445" x="17" y="845.6798">Exclusion is scoped; missing evidence remains UNKNOWN.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="434.3896" x="17" y="862.168">CONFLICT C9 CONDITIONAL / UNORIENTED / holder UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.9072" x="17" y="878.6563">resource=X sources=a/O1, b/O2</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="443.2422" x="17" y="895.1446">CONFLICT C10 CONDITIONAL / UNORIENTED / holder UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.8662" x="17" y="911.6329">resource=Y sources=a/O2, b/O1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.9961" x="17" y="928.1212">Candidate W1 EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6611" x="17" y="944.6095">W1 CONTRADICTED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.9795" x="17" y="961.0977">W3 UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.9795" x="17" y="977.586">W7 UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.9961" x="17" y="994.0743">Candidate W4 EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6611" x="17" y="1010.5626">W1 CONTRADICTED</text><text fill="#000000" font-family="sans-serif" font-size="