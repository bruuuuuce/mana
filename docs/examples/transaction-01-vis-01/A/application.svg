<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="320px" preserveAspectRatio="none" style="width:588px;height:320px;background:#FFFFFF;" version="1.1" viewBox="0 0 588 320" width="588px" zoomAndPan="magnify"><title>synthetic_O_A01 / APPLICATION DEPENDENCY</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="336.335" x="122.311" y="23.5352">synthetic_O_A01 / APPLICATION DEPENDENCY</text><rect fill="#DDDDDD" height="240.8359" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="556.957" x="12" y="59.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="530.4688" x="17" y="78.0234">KNOWN / VERIFIED = validated static structure only; execution CONDITIONAL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="546.957" x="17" y="94.5117">UNKNOWN is not absence. Runtime NOT_RUN; locks and waits are not observed.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.9365" x="17" y="111">P IDs are participant-local symbolic identities; no confirmed deadlock claim.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.4092" x="17" y="127.4883">Coverage: INCOMPLETE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="273.0273" x="17" y="143.9766">Assessment: CONDITIONAL_CYCLE_RISK</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="339.3838" x="17" y="160.4648">INCOMPLETE: UNRESOLVED_DATA_OR_CAUSALITY</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.3926" x="17" y="176.9531">Candidate W1 / cut=common / EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335.7813" x="17" y="193.4414">UNKNOWN obligations: W3, W7; contradicted: W1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="289.3926" x="17" y="209.9297">Candidate W4 / cut=common / EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335.7813" x="17" y="226.418">UNKNOWN obligations: W3, W7; contradicted: W1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.8389" x="17" y="242.9063">No universal deadlock freedom. See evidence.json for full source references.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="513.3857" x="17" y="259.3945">DB dashed red = candidate wait; app solid blue = synchronous completion.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="474.4277" x="17" y="275.8828">Mixed dotted purple = typed relation, not an additional DB wait edge.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.6953" x="17" y="292.3711">Application/typed links are scenario-wide; only DB edges are filtered by cut.</text><!--SRC=[hLFBRjim4BppA_O34hb12nImuOCggO0GHJByY9kJG9ChcpL52YHbnt_VfGKa-O0U10hapkpCS1di0C72mOPWUv3AeGZA6kRFoWpSyHxyYKjxLUO87TSUML118_YR2ISCIhHDctvxWXcagrLLPkcsR6h8YrLHvqMTlJ6DHpGID7Q1FTVDlgRIrs9T_YwB79PmuLf97b223vpeQ76Z2AD3i4RV5e3lACOe2RAcpij8drO9szKJcV9WR01-y6W49h0UJL0zGjris_MkNe2suko1auGhLu7-Y3aYB27S1MN2Lb3cqpuP9Wbgu2Oy4evhijaVh2PPIY8H1uL-GN0GrdJAzIHR8fUn1mZDLP-mp5xGyIFEeQopvcLL5Tk2fTwZzprHpB_QQBEth2hQTRbvPf_LSzZLwsBJLAz5tkRfDcsRTPkbkqrQbTitbf6NUsImZx5JE4jX-vu2ca7n9wjsUP5_n6CFMXrvZC_FOV_z0VO_5r5yS5mgGR7JxjDNoX__YRAsC1f5KNXAyIEZpY5AsoUmGGIyn53fqlvwwjHP1zseAN8xEe7Wi4CNZtt2ybyWkJzHsew-9OWFlV5E5y27WM0qI73G8r81JQSuEMliw4bQFsYCUXFsejxZbT6mqpACZWweEjo6ExM-ktgO1ie0brB53J900c8dG7d4XAN3G2DnB