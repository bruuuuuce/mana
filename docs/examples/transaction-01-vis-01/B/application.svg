<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="287px" preserveAspectRatio="none" style="width:588px;height:287px;background:#FFFFFF;" version="1.1" viewBox="0 0 588 287" width="588px" zoomAndPan="magnify"><title>synthetic_O_B01 / APPLICATION DEPENDENCY</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="334.8447" x="123.0562" y="23.5352">synthetic_O_B01 / APPLICATION DEPENDENCY</text><rect fill="#DDDDDD" height="207.8594" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="556.957" x="12" y="59.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="530.4688" x="17" y="78.0234">KNOWN / VERIFIED = validated static structure only; execution CONDITIONAL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="546.957" x="17" y="94.5117">UNKNOWN is not absence. Runtime NOT_RUN; locks and waits are not observed.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.9365" x="17" y="111">P IDs are participant-local symbolic identities; no confirmed deadlock claim.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.4092" x="17" y="127.4883">Coverage: INCOMPLETE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="331.5293" x="17" y="143.9766">Assessment: NO_CYCLE_IN_MODELED_SCENARIO</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="339.3838" x="17" y="160.4648">INCOMPLETE: UNRESOLVED_DATA_OR_CAUSALITY</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="290.083" x="17" y="176.9531">Candidate W1 / cut=one_wait / EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335.7813" x="17" y="193.4414">UNKNOWN obligations: W3, W7; contradicted: W1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.8389" x="17" y="209.9297">No universal deadlock freedom. See evidence.json for full source references.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="513.3857" x="17" y="226.418">DB dashed red = candidate wait; app solid blue = synchronous completion.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="474.4277" x="17" y="242.9063">Mixed dotted purple = typed relation, not an additional DB wait edge.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.6953" x="17" y="259.3945">Application/typed links are scenario-wide; only DB edges are filtered by cut.</text><!--SRC=[HL9TRwCm47pthzWVqDAhxk6aH7sWu9FG4HFbexa-8GSlYI_6HhP9ctz_wo2r3yYmtXbcPZUw4QA3eulH3Q2qnovgPrcuQ3jABmS8PwdSXxOdwAK9oAAE1Y7SR3nZr5tRjAy_dk49ylMwhefyLpK2IhxcekIYU6S6JsWL6EmZ-oEQWw3MDxwfVbUyX1UuIgELZAWWH4bqTFYfYvD7SDRSbe2Vs4r94XIDAAj4dzSPsukPJ0UmBe8y1hGTPh2PRDG3WcXsxMOlbc1STmaWISA7r97UY3aX727y5LN6rb2LSvqCamGzIXiV2ISDsHoEpf0ihP28eyQm93XqplRQ3oHReLJf7z0PgOUC5UwANfvm0PKecjMwvZlEyX0mX84e5gIiBTwBchULQ5TDoMjUjjk2YtnJDUmRiu2zsF1jKx_HVPdlyhRPj4M-t-PrjNjd1Jcw1mU753v5zE8ijiaZVVA_HRqlUVaLapiQVP8fnh20myy7EFnQ9XFHIwKxYf-gpqmucAmc_O6iVndhFQ9oGmPRHC1hIeAI_XTe9Btpq4-6SdAJxn0yzkZJTSXO-GfAXZD5vEbvWUvBSHAv13cE1AFfmz5CI0sqKjtPE-kcGDA6qM3Icx6L_amvquRICKwUBgWxtiOxjRcxUfYtm89KIgS26I01zpXGdJ1Z-JZI7E_DJpFMQ7kPvnuwjD9hz_X1vfRtnKle19mRUcqY9Xl7MuewOxJIysB_1m00]--></g></svg>