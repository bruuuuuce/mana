gthAdjust="spacing" textLength="184.1519" x="370.53" y="333.7166">DATABASE DEPENDENCY C11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.7495" x="417.7312" y="349.0272">CONDITIONAL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.9346" x="426.1386" y="364.3377">resource=X</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.5347" x="419.8386" y="379.6483">cut=one_wait</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.9873" x="417.1123" y="394.9588">candidate=W2</text></g><!--link N3 to N1--><g id="link_N3_N1"><path d="M55.53,250.1383 C44.37,282.8883 26.18,353.8983 59.19,398.1483 C80.72,426.9983 113.1869,438.1142 146.8669,442.7842 " fill="none" id="N3-to-N1" style="stroke:#8050A0;stroke-width:1;stroke-dasharray:1.0,3.0;"/><polygon fill="#8050A0" points="152.81,443.6083,144.4447,438.4101,147.8574,442.9216,143.3459,446.3343,152.81,443.6083" style="stroke:#8050A0;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.2554" x="127.3038" y="356.7166">MIXED / EXECUTES_IN</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.4829" x="60.19" y="372.0272">CONDITIONAL / R1, R2, R3 / evidence.json</text></g><!--link N4 to N2--><g id="link_N4_N2"><path d="M375.19,81.2683 C375.19,113.3083 375.19,174.9583 375.19,207.0083 " fill="none" id="N4-to-N2" style="stroke:#8050A0;stroke-width:1;stroke-dasharray:1.0,3.0;"/><polygon fill="#8050A0" points="375.19,213.0083,379.19,204.0083,375.19,208.0083,371.19,204.0083,375.19,213.0083" style="stroke:#8050A0;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.2554" x="443.3038" y="124.5466">MIXED / EXECUTES_IN</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.4829" x="376.19" y="139.8572">CONDITIONAL / R4, R5, R6 / evidence.json</text></g><rect fill="#DDDDDD" height="422.207" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="556.957" x="12" y="481.6366"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="530.4688" x="17" y="500.1717">KNOWN / VERIFIED = validated static structure only; execution CONDITIONAL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="546.957" x="17" y="516.66">UNKNOWN is not absence. Runtime NOT_RUN; locks and waits are not observed.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.9365" x="17" y="533.1483">P IDs are participant-local symbolic identities; no confirmed deadlock claim.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.4092" x="17" y="549.6366">Coverage: INCOMPLETE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="331.5293" x="17" y="566.1248">Assessment: NO_CYCLE_IN_MODELED_SCENARIO</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="339.3838" x="17" y="582.6131">INCOMPLETE: UNRESOLVED_DATA_OR_CAUSALITY</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="290.083" x="17" y="599.1014">Candidate W1 / cut=one_wait / EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335.7813" x="17" y="615.5897">UNKNOWN obligations: W3, W7; contradicted: W1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.8389" x="17" y="632.078">No universal deadlock freedom. See evidence.json for full source references.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="513.3857" x="17" y="648.5663">DB dashed red = candidate wait; app solid blue = synchronous completion.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="474.4277" x="17" y="665.0545">Mixed dotted purple = typed relation, not an additional DB wait edge.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.6953" x="17" y="681.5428">Application/typed links are scenario-wide; only DB edges are filtered by cut.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.9307" x="17" y="698.0311">Cut one_wait</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.8691" x="17" y="714.5194">NO_CYCLE_IN_MODELED_SCENARIO</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="398.6445" x="17" y="731.0077">Exclusion is scoped; missing evidence remains UNKNOWN.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="457.748" x="17" y="747.4959">Validated S02 structural exclusion in this cut / selected scope only.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="425.2705" x="17" y="763.9842">This is distinct from missing acquisition or retention evidence.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="434.3896" x="17" y="780.4725">CONFLICT C9 CONDITIONAL / UNORIENTED / holder UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.9072" x="17" y="796.9608">resource=X sources=a/O1, b/O1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="443.2422" x="17" y="813.4491">CONFLICT C10 CONDITIONAL / UNORIENTED / holder UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.8662" x="17" y="829.9373">resource=Y sources=a/O2, b/O2</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.9961" x="17" y="846.4256">Candidate W1 EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6611" x="17" y="862.9139">W1 CONTRADICTED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.9795" x="17" y="879.4022">W3 UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.9795" x="17" y="895.8905">W7 UNKNOWN</text><!--SRC=[dLLjJ-Cu4FxkNp5QlfP2oxAxHyL98KbrqPK4zOM2ZbFa9DFMIsfdROUNVtzZ5qeGw7GwGLl7ddayCyyp4wiQi0eAPQtQGYKqbbOeoSoza0tNV0jcmolrAEGQLhmsoAomDO9vbdQ3LfHvbbyS3-08BfERE88elehJA4x3MzgopmrMK0jvRvW3vd9Dhb-k_hYT9M4m0KusLuClm0sa0pW8m_XqFFxKikXO3lUMj3pyw-3Y-8J-UXKt6wp-FloTiCuW2kR1HJ2Bkm65Wy6T3BCqIkP9bWQJEwdHg5QNU7vp9ylMdYk9-ICNbfwuh4J5BPulXqmgYw35UcD1hIW05jPSR1qUXOKFea9POl-dSNNpUEOCYgDiq0DEtwpHk1N6RTxa1CaBRh17QrNyf5JzwW5rpPkE9H_alFpL4Xyzjou4XIFNVgtnLul6lZVMQBcGFIWwjiLdjaMjodj_N2hAMMkK50AvO8Fq9MtEEzRT_OBH0bmjkXIDfy5bx9aSl_1p0WVHj_5fzEsZMT4n-xet8m-YySVnwN50D98ItsZSYUe8ufiuNCpZMPwaxoYaeocLUJgapya7CkYEJu67_mtuAu6UqkVR1-0QrwuMDQui-pFDbYbPNCVJP9mGw3ayyDfhfm9ZEVK8_UYsjAr6KB9-7W4-8ScD-WmwL_RP8js12UFA3Bmm_agOjjAABKAQpVFf8Xs1uz00IHISMcb5oCv3aOT-mAhFhY29TllKnHI2QBYqX-J7Q-hTRQ5g2ikbHEqiq8p8tGbY9VIMmgwGL-uEA9tG-onq0kLhF8Ca3RFBgqayZrbWI29cIn1d55aUteQJcCgONsPHF8cZV1R6QJ1DClRcSmQBT1hFiiardRiMpRDf7WQBMJ19vhSiV6qwMBhEwdQafogSBA8usfT95RLOSrT6Kkhof0VBxoENXDMy4YMLdtO7B5NGIa7n6qfzdzXA8rPgsuSPudjoOQKqhDgQwkHx6JIkKBjZqsVH1Upc3ErMnFH-J7WYHi2RXjo8VUgp5ic0vcIvqKggrb1eswP65s-VNOedLsUlIMXQJGTalHkO6ckVLM-d0WcygeJRe0Ge05yEhDROPq7J48_U-AWpR3tlfaJ9jL27ZvJSo0lFUJl7dS5Ar1PT6iMpApMnt9A2NkhD_fNH-AciM-FqIr8rfQARHq0ZmxZNn6irAOyjpIG3BtprsVM-BsR7mtrJK5RuXYV1RWYK0YBA3TPO-ZvoT