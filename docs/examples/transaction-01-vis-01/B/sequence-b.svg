="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.6294" x="11" y="151.5449">Scenario synthetic_O_B01 / participant b</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.9512" x="11" y="166.8555">Local causal order only; panels are not a global concurrent schedule.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="468.6919" x="11" y="182.166">SUSPEND retains lifetime; neither END nor suspension proves lock release.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="492.5781" x="11" y="197.4766">KNOWN / VERIFIED = validated static structure only; execution CONDITIONAL.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="507.8887" x="11" y="212.7871">UNKNOWN is not absence. Runtime NOT_RUN; locks and waits are not observed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="481.8696" x="11" y="228.0977">P IDs are participant-local symbolic identities; no confirmed deadlock claim.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.0942" x="11" y="243.4082">Coverage: INCOMPLETE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.8486" x="11" y="258.7188">Assessment: NO_CYCLE_IN_MODELED_SCENARIO</text><polygon fill="#181818" points="535.8496,288.7715,545.8496,292.7715,535.8496,296.7715,539.8496,292.7715" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="269.2515" x2="541.8496" y1="292.7715" y2="292.7715"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.5981" x="276.2515" y="288.0293">fixture.Paths#xy() / CONDITIONAL_CALL</text><path d="M392,307.7715 L567.0317,307.7715 L567.0317,315.0