engthAdjust="spacing" textLength="189.9663" x="558" y="767.9297">Runtime execution UNKNOWN</text><path d="M477,785.6719 L477,810.6719 L617,810.6719 L617,795.6719 L607,785.6719 L477,785.6719 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M607,785.6719 L607,795.6719 L617,795.6719 L607,785.6719 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.5518" x="483" y="803.2402">6 LOGICAL_END L1</text><path d="M402,820.9824 L402,845.9824 L693,845.9824 L693,830.9824 L683,820.9824 L402,820.9824 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M683,820.9824 L683,830.9824 L693,830.9824 L683,820.9824 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.4102" x="408" y="838.5508">7 PHYSICAL_END_OUTCOME_UNKNOWN P1</text><polygon fill="#181818" points="280.2515,875.6035,270.2515,879.6035,280.2515,883.6035,276.2515,879.6035" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="274.2515" x2="546.8496" y1="879.6035" y2="879.6035"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.2671" x="286.2515" y="874.8613">scope exit / outcome UNKNOWN</text><rect fill="#DDDDDD" height="207.8594" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="618.7676" x="12" y="900.6035"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="521.3154" x="17" y="919.1387">All P identifiers are SYMBOLIC_SCENARIO; actual runtime identity UNKNOWN.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="450.2969" x="17" y="935.627">L = TRANSACTION_LOGICAL_SCOPE; P = TRANSACTION_PHYSICAL</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="437.8418" x="17" y="952.1152">S = TRANSACTION_SUSPENDED; SP = TRANSACTION_SAVEPOINT</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="314.5352" x="17" y="968.6035">Green: shared physical context / logical scope</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="466.5459" x="17" y="985.0918">Blue: independent physical scope; outer P retained while SUSPENDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="279.8633" x="17" y="1001.5801">Yellow: nested SAVEPOINT on the SAME P</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="417.5459" x="17" y="1018.0684">Gray: NO_TRANSACTION; red: UNKNOWN / unsupported path</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="500.0488" x="17" y="1034.5566">Groups show method nesting. BEGIN/END notes define physical lifetimes.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="443.4131" x="17" y="1051.0449">Suspended lifetime overlap is explicit in SUSPEND/RESUME notes.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="608.7676" x="17" y="1067.5332">Interception: APPLIED / BYPASSED / UNKNOWN; context: ACTIVE / INACTIVE / UNKNOWN.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="499.0166" x="17" y="1084.0215">INHERITED physical context does not require interception of this method.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="556.5889" x="17" y="1100.5098">AspectJ ASSUMED_APPLIED is a conditional premise, never runtime weaving proof.</text><!--SRC=[pLPTZ-8s57tFhxZQUMcb3YpJpbG2KIc4iCqsawG4TXTffSWaPl0snDHs6FZtFKu8mtv9VTodoSJszJddddl2LXISD