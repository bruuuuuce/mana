0000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.6426" x="227.8005" y="91.6777">premises: X_database, X_object, X_overlap</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.5864" x="227.8005" y="106.9883">premises: a1_acquire, a1_binding, a1_request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.6138" x="227.8005" y="122.2988">premises: a1_retain, b1_binding, b1_request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.9561" x="227.8005" y="137.6094">premises: blocking, concurrent, independent_a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.1421" x="227.8005" y="152.9199">premises: independent_b</text></g><!--link N2 to N1--><g id="link_N2_N1"><path d="M120.7805,120.4883 C120.7805,160.3983 120.7805,252.1083 120.7805,292.2483 " fill="none" id="N2-to-N1" style="stroke:#B03030;stroke-width:1;stroke-dasharray:7.0,7.0;"/><polygon fill="#B03030" points="120.7805,298.2483,124.7805,289.2483,120.7805,293.2483,116.7805,289.2483,120.7805,298.2483" style="stroke:#B03030;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.1519" x="121.7805" y="204.2266">DATABASE DEPENDENCY C11</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.7495" x="168.9817" y="219.5372">CONDITIONAL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.9346" x="177.3891" y="234.8477">resource=X</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.5347" x="171.0891" y="250.1583">cut=one_wait</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.9873" x="168.3628" y="265.4688">candidate=W2</text></g><rect fill="#DDDDDD" height="422.207" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="556.957" x="12" y="352.1466"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="530.4688" x="17" y="370.6817">KNOWN / VERIFIED = validated static structure only; execution CONDITIONAL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="546.957" x="17" y="387.17">UNKNOWN is not absence. Runtime NOT_RUN; locks and waits are not observed.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.9365" x="17" y="403.6583">P IDs are participant-local symbolic identities; no confirmed deadlock claim.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158.4092" x="17" y="420.1466">Coverage: INCOMPLETE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="331.5293" x="17" y="436.6348">Assessment: NO_CYCLE_IN_MODELED_SCENARIO</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="339.3838" x="17" y="453.1231">INCOMPLETE: UNRESOLVED_DATA_OR_CAUSALITY</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="290.083" x="17" y="469.6114">Candidate W1 / cut=one_wait / EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="335.7813" x="17" y="486.0997">UNKNOWN obligations: W3, W7; contradicted: W1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.8389" x="17" y="502.588">No universal deadlock freedom. See evidence.json for full source references.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="513.3857" x="17" y="519.0763">DB dashed red = candidate wait; app solid blue = synchronous completion.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="474.4277" x="17" y="535.5645">Mixed dotted purple = typed relation, not an additional DB wait edge.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.6953" x="17" y="552.0528">Application/typed links are scenario-wide; only DB edges are filtered by cut.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="87.9307" x="17" y="568.5411">Cut one_wait</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.8691" x="17" y="585.0294">NO_CYCLE_IN_MODELED_SCENARIO</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="398.6445" x="17" y="601.5177">Exclusion is scoped; missing evidence remains UNKNOWN.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="457.748" x="17" y="618.0059">Validated S02 structural exclusion in this cut / selected scope only.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="425.2705" x="17" y="634.4942">This is distinct from missing acquisition or retention evidence.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="434.3896" x="17" y="650.9825">CONFLICT C9 CONDITIONAL / UNORIENTED / holder UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.9072" x="17" y="667.4708">resource=X sources=a/O1, b/O1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="443.2422" x="17" y="683.9591">CONFLICT C10 CONDITIONAL / UNORIENTED / holder UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="225.8662" x="17" y="700.4473">resource=Y sources=a/O2, b/O2</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.9961" x="17" y="716.9356">Candidate W1 EXCLUDED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.6611" x="17" y="733.4239">W1 CONTRADICTED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.9795" x="17" y="749.9122">W3 UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.9795" x="17" y="766.4005">W7 UNKNOWN</text><!--SRC=[dLHTJ-iu47tthnZT-reA1QskbegLIXAqrPO4zOE2bbNa9DFMbzJEjHq-_lqUfr2AXFPXrQgTE3FZcNFEZ3SDUKE5yTvigLAMIw-C5kvHwKPQkIMtaPLvLdfDArax5bxvciczQhzXhyeyoozF1dHCyMW-kXpD4egJcoIDapIw5o6Rr6luVxlvytusZaOJal2z6NmZwIWTqFSeIdwxklhIipZmFDrxmZpw-_lboHa-lKgw3LV_7Fs1NETVbK3HOF2WeooDn_Dnbeuc3zgoCwqj-UBkGPUjlp2QysUfF9wahbGbFLyiJuKsdicgzSQJMQ404TLIRKC-bCLFgc9TSl-d2s1r-Tmv5SVPe4SIlwAnl5Kk7DxbI2aBwRW7snG_qMfdFR6jPNFWAGUvB7-r8A4Nx4AX7BtkRCk_MdR-ixDbBvNkKN7WMtpbMzIcVEnUbmOzMyiQ9I246yQFzhayy3uyBmGC2bY8cjV1hddbnLzfjao1msqo7L-DavWkw4dM7NOLEIyX3FpPjlIjPJAwVXqIlp3WXhZeW8w-MAIxPCg5QqWMhWEMfgtsQikKPlDykaY757fm18eei0KBcKE4GOHzugelRcWSxyuXNPIW6gdz4U9a3S5k2rEZh40SDApO3H4U05afkqNP5Sigt45b8Belea2GNFCvZTCekxwP9FD4Z1mWSbkaE4TbUNGVJP9ydERNMPnCaZYVHKawceupyH5pJejqcioooItU1udcsJIFHelPQ3AUtuleNNIq3CewL2GUaxjeieYJU0-JAMgrbW56CBKywz7onp0quQsiL0duSJeGgQ5MAzJlqFg-iPLbhiosJpFcpnAcbR6qQclWr6cPBA_OXjUkB-9BsiqPJYimlH-JZeWXoQP16DY7pbg60vP3kR56czQXj6rJSwYtBwxLIy0PkmP_JMln0jx-jUbIrrrNlPqADCcgKk403Q203WwkrjmNewO1ZvtpyIwsLlfnnxihMKkhpD4pcXjsmWlH8N3di5Arvz16yHgW1iij5FI6j_XFHfENicvTq2-awag3cuU4aN5XDxwZYJwsc4b7RtprnUr-BcOdf_kXG5VyaK-Jto0f2WBbZcikkpaATtGzzCKylCUtKiuhNNfmYNtzVdktDLm75u58x8MWSJpiIHQOkQl9E9fJzFlX_E6-HPfDnqawnnGVqyRK5TltwiN7hdmJXhkGtOuBc-uWv-3a_oIzFqnwsYKz_JmFU_d3nWNpwIZ6VU7vR9zk-MDlOZ_jjjI_]--></g></svg>