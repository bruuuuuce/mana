000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.6426" x="230.5603" y="91.6777">premises: X_database, X_object, X_overlap</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.5864" x="230.5603" y="106.9883">premises: a1_acquire, a1_binding, a1_request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.6079" x="230.5603" y="122.2988">premises: a1_retain, a2_binding, a2_request</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.1797" x="230.5603" y="137.6094">premises: blocking, outer</text></g><!--link N2 to N1--><g id="link_N2_N1"><path d="M124.8503,112.9083 C124.8503,151.5783 124.8503,237.9583 124.8503,276.8583 " fill="none" id="N2-to-N1" style="stroke:#B03030;stroke-width:1;stroke-dasharray:7.0,7.0;"/><polygon fill="#B03030" points="124.8503,282.8583,128.8503,273.8583,124.8503,277.8583,120.8503,273.8583,124.8503,282.8583" style="stroke:#B03030;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.9316" x="125.8503" y="188.9166">DATABASE DEPENDENCY C7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.7495" x="168.9414" y="204.2272">CONDITIONAL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.9346" x="177.3488" y="219.5377">resource=X</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.8149" x="159.9087" y="234.8483">cut=replacement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.9873" x="168.3225" y="250.1588">candidate=W1</text></g><rect fill="#DDDDDD" height="240.8359" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="556.957" x="12" y="336.8366"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="530.4688" x="17" y="355.3717">KNOWN / VERIFIED = validated static structure only; execution CONDITIONAL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="546.957" x="17" y="371.86">UNKNOWN is not absence. Runtime NOT_RUN; locks and waits are not observed.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="518.9365" x="17" y="388.3483">P IDs are participant-local symbolic identities; no confirmed deadlock claim.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="268.0098" x="17" y="404.8366">Coverage: COMPLETE_MODELED_SCOPE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="420.1777" x="17" y="421.3248">Assessment: CONDITIONAL_CROSS_LAYER_COMPLETION_RISK</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.8389" x="17" y="437.8131">No universal deadlock freedom. See evidence.json for full source references.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="513.3857" x="17" y="454.3014">DB dashed red = candidate wait; app solid blue = synchronous completion.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="474.4277" x="17" y="470.7897">Mixed dotted purple = typed relation, not an additional DB wait edge.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="519.6953" x="17" y="487.278">Application/typed links are scenario-wide; only DB edges are filtered by cut.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.9248" x="17" y="503.7663">Cut replacement</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="330.5176" x="17" y="520.2545">CONDITIONAL_CROSS_LAYER_COMPLETION_RISK</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="398.6445" x="17" y="536.7428">Exclusion is scoped; missing evidence remains UNKNOWN.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="434.3896" x="17" y="553.2311">CONFLICT C6 CONDITIONAL / UNORIENTED / holder UNKNOWN</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.8271" x="17" y="569.7194">resource=X sources=a/O1, a/O2</text><!--SRC=[ZLJlQzim4Fskl-9OlwRkah4D6Z98RPUPfNP8qcrb7KQnpebQMV8akJ_- -vtijikWWn683-dT-TsxT_Qc1MzWQxmt3GXfiVBIQEPkfMwvvGsuFHVcNkeTr5mvP5vwXU0UjT-ZbrLPbF7RCPn0Cj_Cp-Rh599qcUP9ciTNB5JZUaVuDylFL-iidY-04tOvVWFSGJw6epXEtv-V_niv6P2J5oI5np-Epjw-ezz8SBT7yVFu4zKwVOq2n1-lTLpaIRR9Ydo-kDOMdUbiXRFlrxhg_CnYgtY53MfF1rmBARZ7sRSnqyOZMBdRUp0rKM2nuhAXYiGBxwH0NM5quu9QVKLt2loac8p2_vYr5Xlfmk7taYhoBNSuejXiRwZNFhf3gtXxWEJZabU_Efh2ACHRIMpqheyj_khG-R_15ZsNckud1zZ9AzYjCjLjVsqwZvQX5X3QOmft8LPOU_ObBxxbrDlNT9MTPsa2CxZZgfT3WFESfaqFsrM-imX6gySfu0EIYEGOE10vOfVvK4owy1hWMzUB1QjEUzaWvCMcN5tcKmYy793gSC-bfuWgXmn36VOEHSIMa2N3EVcHACYMQtzCULoH2vkjKKGh38ECAT5DAHqgesjf6w8ja8lm3gZ2x28M1z7v3a-9xyLoaMxIyg98qaMQbEkuMAPixaWm5znmUjXI6Q-AzRfSpA_ILVcKIXVbAbj_ORc1Jaigx8ZJonjhYoXC4y4QyM-_G6qir9sY1dhZWCKQRRXs4KlEO70rdGeQmOibUuMcmDkMqcWiDDGE2K2hMEsjqQPpr7ZJAWppYDY5V0W2q6RJe-qiNH3QFxPzQSK3QZICHmCNGeO3Qe08X3S1YXr6RDws970FFXbobTItmq1SXPfRQOxlgRbfxuYG7H87G2qLkOrojez0DY7vEmy72yV-L-7qeLAT2pOZHxdA48yfaBTT-2uzQqkL6re71q_kYqBvyqKMRo3-S3XCylXbNgooDD-GoqzWRvH0-vp6_dmXdkRZPc6Z-xsUXDKPbkOt]--></g></svg>