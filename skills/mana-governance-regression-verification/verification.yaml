{
  "schema_version": 1,
  "skill_id": "mana-governance-regression-verification",
  "applicability": {
    "all": [
      {"type": "manifest_exists", "paths": ["scripts/mana-eval.sh", "evals/scenarios"]}
    ],
    "any": [
      {"type": "changed_path", "patterns": ["profiles/*.yaml", "skills/*/SKILL.md", "skills/index.yaml", "agents/*/AGENT.md", "agents/*/playbook.md", "evals/scenarios/**", "scripts/mana-eval.sh", "scripts/lib/execution-plan.sh", "scripts/lib/profile-metadata.sh"]},
      {"type": "explicit_invocation"}
    ]
  },
  "checks": [
    {
      "id": "mana-eval",
      "adapter": "mana_eval",
      "scope": "relevant_scenarios",
      "required": true,
      "timeout_seconds": 120,
      "cost": "normal",
      "trust_origin": "framework_declared",
      "effects": {
        "source_tree": "none",
        "mana_workspace": "write",
        "build_outputs": "none",
        "external_state": "none",
        "network": "none"
      }
    }
  ],
  "success": {
    "requires": ["mana-eval"],
    "accepted_results": ["passed"]
  },
  "limits": {
    "max_checks": 10,
    "max_seconds": 600,
    "max_output_bytes": 16384
  }
}
