{
  "schema_version": 1,
  "skill_id": "shell-syntax-verification",
  "applicability": {
    "all": [
      {"type": "repository_available"}
    ],
    "any": [
      {"type": "changed_extension", "extensions": ["sh"]},
      {"type": "changed_path", "patterns": ["hooks/pre-commit", "hooks/pre-push"]}
    ]
  },
  "checks": [
    {
      "id": "bash-syntax",
      "adapter": "bash_syntax",
      "scope": "changed_files",
      "required": true,
      "timeout_seconds": 60,
      "cost": "cheap",
      "trust_origin": "framework_declared",
      "effects": {
        "source_tree": "none",
        "mana_workspace": "write",
        "build_outputs": "none",
        "external_state": "none",
        "network": "none"
      }
    }
  ],
  "success": {
    "requires": ["bash-syntax"],
    "accepted_results": ["passed"]
  },
  "limits": {
    "max_checks": 20,
    "max_seconds": 300,
    "max_output_bytes": 16384
  }
}
